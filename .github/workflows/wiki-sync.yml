name: Wiki 同步

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      mode:
        description: "同步模式"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - sync
      sync_range:
        description: "同步范围：latest-tag 按最近 tag 差异同步，full 会全量清理重建"
        required: true
        default: latest-tag
        type: choice
        options:
          - latest-tag
          - custom-ref
          - last-commit
          - full
      diff_from:
        description: "custom-ref 模式使用的起始 tag/commit，例如 v6.5"
        required: false
        default: ""
        type: string
      skip_honor:
        description: "是否跳过荣誉室"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      filter:
        description: "可选：只同步某个子目录，例如 职业/战技侧"
        required: false
        default: ""
        type: string
      delay:
        description: "Fandom API 请求间隔秒数"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: 执行 Wiki 同步
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      WIKI_USER_SECRET: ${{ secrets.WIKI_USER }}
      WIKI_PASSWORD_SECRET: ${{ secrets.WIKI_PASSWORD }}

    concurrency:
      group: wiki-sync
      cancel-in-progress: false

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 安装 pandoc
        run: choco install pandoc -y
        shell: cmd

      - name: 安装 Wiki 同步依赖
        run: python -m pip install --upgrade mwclient
        shell: pwsh

      - name: 执行同步脚本
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
          SYNC_RANGE_INPUT: ${{ github.event.inputs.sync_range }}
          DIFF_FROM_INPUT: ${{ github.event.inputs.diff_from }}
          SKIP_HONOR_INPUT: ${{ github.event.inputs.skip_honor }}
          FILTER_INPUT: ${{ github.event.inputs.filter }}
          DELAY_INPUT: ${{ github.event.inputs.delay }}
        run: |
          $mode = $env:MODE_INPUT
          $syncRange = $env:SYNC_RANGE_INPUT
          $diffFrom = $env:DIFF_FROM_INPUT
          $skipHonor = $env:SKIP_HONOR_INPUT
          $filter = $env:FILTER_INPUT
          $delay = $env:DELAY_INPUT
          $currentTag = $env:GITHUB_REF_NAME

          git fetch --force --tags

          if ([string]::IsNullOrWhiteSpace($syncRange)) {
            $syncRange = "latest-tag"
          }

          if ([string]::IsNullOrWhiteSpace($delay)) {
            $delay = "5"
          }

          $diffBaseText = "无（full 全量同步）"

          if ($env:GITHUB_EVENT_NAME -eq "push") {
            $mode = "sync"
            $syncRange = "tag-diff"
            $skipHonor = "false"
            $filter = ""

            if ([string]::IsNullOrWhiteSpace($currentTag)) {
              Write-Error "Tag 推送自动真实同步需要 GITHUB_REF_NAME。"
              exit 1
            }

            $allTags = @(git tag --sort=-creatordate)
            $previousTag = $allTags | Where-Object { $_ -ne $currentTag } | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($previousTag)) {
              Write-Error "未找到当前 tag 的上一个 tag，停止自动 Wiki 同步；请先手动 dry-run 后再决定是否全量同步。"
              exit 1
            }

            Write-Host "Tag 推送自动真实同步：$previousTag -> $currentTag"
            $diffFrom = $previousTag
            $diffBaseText = $previousTag
          }

          if ($mode -eq "sync" -and $syncRange -eq "full" -and -not [string]::IsNullOrWhiteSpace($filter)) {
            Write-Error "过滤同步不能搭配 full 真实同步；请改用 latest-tag/custom-ref/last-commit，或清空 filter 后全量同步。"
            exit 1
          }

          if ($mode -eq "sync") {
            if ([string]::IsNullOrWhiteSpace($env:WIKI_USER_SECRET) -or [string]::IsNullOrWhiteSpace($env:WIKI_PASSWORD_SECRET)) {
              Write-Error "真实同步需要配置 GitHub Secrets：WIKI_USER 和 WIKI_PASSWORD。"
              exit 1
            }
            $wikiUser = $env:WIKI_USER_SECRET
            $wikiPassword = $env:WIKI_PASSWORD_SECRET
          } else {
            $wikiUser = "DRY_RUN_USER"
            $wikiPassword = "DRY_RUN_PASSWORD"
          }

          $scriptArgs = @(
            "wiki/sync_to_wiki.py",
            "--source-dir", ".",
            "--user", $wikiUser,
            "--password", $wikiPassword,
            "--delay", $delay
          )

          if ($syncRange -eq "tag-diff") {
            $scriptArgs += @("--diff-from", $diffFrom)
          } elseif ($syncRange -eq "latest-tag") {
            $latestTag = (git describe --tags --abbrev=0).Trim()
            if ([string]::IsNullOrWhiteSpace($latestTag)) {
              Write-Error "未找到可用于 diff 的最新 tag；请改用 custom-ref 或 full。"
              exit 1
            }
            Write-Host "使用最近 tag 作为同步差异基准：$latestTag"
            $diffBaseText = $latestTag
            $scriptArgs += @("--diff-from", $latestTag)
          } elseif ($syncRange -eq "custom-ref") {
            if ([string]::IsNullOrWhiteSpace($diffFrom)) {
              Write-Error "custom-ref 模式需要填写 diff_from。"
              exit 1
            }
            $diffBaseText = $diffFrom
            $scriptArgs += @("--diff-from", $diffFrom)
          } elseif ($syncRange -eq "last-commit") {
            $diffBaseText = "HEAD~1"
            $scriptArgs += "--incremental"
          } elseif ($syncRange -ne "full") {
            Write-Error "未知同步范围：$syncRange"
            exit 1
          }

          if ($mode -eq "dry-run") {
            $scriptArgs += "--dry-run"
          }

          if ($skipHonor -eq "true") {
            $scriptArgs += "--skip-honor"
          }

          if (-not [string]::IsNullOrWhiteSpace($filter)) {
            $scriptArgs += @("--filter", $filter)
          }

          Write-Host "::group::Wiki 同步参数"
          Write-Host "同步模式: $mode"
          Write-Host "同步范围: $syncRange"
          Write-Host "差异基准: $diffBaseText"
          Write-Host "跳过荣誉室: $skipHonor"
          Write-Host "过滤目录: $(if ([string]::IsNullOrWhiteSpace($filter)) { '无' } else { $filter })"
          Write-Host "请求间隔: $delay 秒"
          Write-Host "实际写入 Wiki: $(if ($mode -eq 'sync') { '是' } else { '否，dry-run' })"
          Write-Host "脚本参数: $($scriptArgs -join ' ')"
          Write-Host "::endgroup::"

          @(
            "## Wiki 同步参数"
            ""
            "- 同步模式: ``$mode``"
            "- 同步范围: ``$syncRange``"
            "- 差异基准: ``$diffBaseText``"
            "- 跳过荣誉室: ``$skipHonor``"
            "- 过滤目录: ``$(if ([string]::IsNullOrWhiteSpace($filter)) { '无' } else { $filter })``"
            "- 请求间隔: ``$delay`` 秒"
            "- 实际写入 Wiki: ``$(if ($mode -eq 'sync') { '是' } else { '否，dry-run' })``"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

          python -u @scriptArgs
