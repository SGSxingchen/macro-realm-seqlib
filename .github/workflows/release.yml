name: 发布序列库

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v6.6）"
        required: true
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 安装 pandoc
        run: choco install pandoc -y
        shell: cmd

      - name: 部署 HTML Help Workshop（仓库自带）
        shell: bash
        run: |
          # 将仓库内置的 hhc.exe 加入 PATH
          HHW_DIR="$(pwd)/tools/hhw"
          echo "$HHW_DIR" >> "$GITHUB_PATH"
          echo "hhc.exe 路径: $HHW_DIR/hhc.exe"
          ls -lh "$HHW_DIR/"

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: 设置系统代码页为 GBK（hhc.exe 需要）
        shell: powershell
        run: |
          # hhc.exe 是 ANSI 应用，依赖系统 ACP 读取中文文件路径
          # 英文 Windows 默认 ACP=1252，改为 936 (GBK)
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage' -Name 'ACP' -Value '936'
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage' -Name 'OEMCP' -Value '936'
          Write-Host "ACP/OEMCP 已设置为 936 (GBK)"

      - name: 校验版本发布配置
        shell: bash
        run: |
          python - "${{ steps.version.outputs.version }}" <<'PY'
          import sys
          from pathlib import Path
          from build_chm import configured_root_files, load_build_config

          version = sys.argv[1]
          root_files = configured_root_files(load_build_config(Path('.')), version)
          if root_files is None:
              if version.lower() == "dev":
                  print("dev 试构建未绑定版本根文件白名单，继续使用通用筛选规则")
                  raise SystemExit(0)
              raise SystemExit(f"未找到 {version} 对应的 root_files 发布配置")
          missing = sorted(name for name in root_files if not Path(name).is_file())
          if missing:
              raise SystemExit("发布配置缺少文件：" + "、".join(missing))
          print(f"{version} 根目录发布文件：")
          for name in sorted(root_files):
              print(f"- {name}")
          PY

      - name: 构建 CHM 和 ZIP
        shell: cmd
        run: |
          chcp 936
          python -u build_chm.py --version "${{ steps.version.outputs.version }}" --source-dir . --output-dir dist

      - name: 列出产物
        shell: bash
        run: |
          ls -lh dist/
          python - "${{ steps.version.outputs.version }}" <<'PY'
          import shutil
          import sys
          from pathlib import Path
          from build_chm import configured_root_files, load_build_config

          version = sys.argv[1].lstrip('vV')
          expected = [
              Path('dist') / f'宏观界域强化序列库V{version}.chm',
              Path('dist') / f'宏观界域强化序列库V{version}.zip',
          ]
          invalid = [str(path) for path in expected if not path.is_file() or path.stat().st_size == 0]
          if invalid:
              raise SystemExit('发布产物缺失或为空：' + '、'.join(invalid))

          if version.lower() == 'dev':
              print('dev 试构建不生成 Release 正文文件')
              raise SystemExit(0)

          root_files = configured_root_files(load_build_config(Path('.')), version)
          changelogs = sorted(name for name in (root_files or set()) if name.startswith('V') and '序列库更新日志' in name)
          if len(changelogs) != 1:
              raise SystemExit(f'{version} 必须配置且只能配置一份版本更新日志，当前为：{changelogs}')
          shutil.copyfile(changelogs[0], Path('dist') / 'release-notes.txt')
          print(f'Release 正文来源：{changelogs[0]}')
          PY

      # tag 推送时：创建 GitHub Release
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "宏观界域强化序列库 ${{ steps.version.outputs.version }}"
          files: |
            dist/*.chm
            dist/*.zip
          body_path: dist/release-notes.txt
          fail_on_unmatched_files: true

      # 手动触发时：上传为 Artifact
      - name: 上传构建产物
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: "序列库-${{ steps.version.outputs.version }}"
          path: dist/*
          if-no-files-found: error
