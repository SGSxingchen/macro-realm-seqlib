name: Tactical tabletop checks
on:
  pull_request:
    paths:
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/tabletop-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tabletop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: python -m pip install -r web/backend/requirements.txt pytest httpx playwright
      - name: Backend authorization, persistence, CAS, media and API tests
        run: python -m pytest -q tests/test_tabletop.py
      - name: Frontend build and source preservation regressions
        run: |
          cd web/frontend
          npm ci
          npm run build
          node --test tests/*.test.cjs
      - name: Install test browser
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Three isolated browsers, two real backend workers, actual service restart
        run: python tests/tabletop_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabletop-verification
          path: web/frontend/test-results/tabletop/
          if-no-files-found: ignore
          retention-days: 14
