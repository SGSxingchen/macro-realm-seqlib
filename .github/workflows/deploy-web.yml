name: 部署 trpg.chordvers.org

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-trpg-web
  cancel-in-progress: true

jobs:
  deploy:
    name: 拉取并重启线上服务
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
      DEPLOY_STATIC_PATH: ${{ vars.DEPLOY_STATIC_PATH }}
      HEALTH_URL: ${{ vars.HEALTH_URL }}

    steps:
      - name: 检查部署密钥配置
        shell: bash
        run: |
          test -n "$DEPLOY_HOST" || { echo "缺少 GitHub Secret: DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "缺少 GitHub Secret: DEPLOY_USER"; exit 1; }
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || { echo "缺少 GitHub Secret: DEPLOY_SSH_KEY"; exit 1; }

      - name: 配置 SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/deploy_key <<'KEY'
          ${{ secrets.DEPLOY_SSH_KEY }}
          KEY
          sed -i 's/^          //' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          HOST="$DEPLOY_HOST"
          HOST="${HOST#http://}"
          HOST="${HOST#https://}"
          HOST="${HOST%%/*}"
          PORT="$(printf '%s' "${DEPLOY_PORT:-61149}" | tr -cd '0-9')"
          if [ -z "$PORT" ] || [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then
            PORT=61149
          fi
          echo "ssh target: ${HOST}:${PORT}"
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: 线上拉取、构建、重启
        shell: bash
        run: |
          HOST="$DEPLOY_HOST"
          HOST="${HOST#http://}"
          HOST="${HOST#https://}"
          HOST="${HOST%%/*}"
          PORT="$(printf '%s' "${DEPLOY_PORT:-61149}" | tr -cd '0-9')"
          if [ -z "$PORT" ] || [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then
            PORT=61149
          fi
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$DEPLOY_USER@$HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH:-/root/AstrBot/data/workspaces/macro-realm-seqlib}' DEPLOY_SERVICE='${DEPLOY_SERVICE:-macro-realm-seqlib.service}' DEPLOY_STATIC_PATH='${DEPLOY_STATIC_PATH:-/www/wwwroot/trpg.chordvers.org}' HEALTH_URL='${HEALTH_URL:-https://trpg.chordvers.org/api/health}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          git fetch --force --tags origin
          git pull --ff-only origin main

          cd "$DEPLOY_PATH/web/backend"
          # 服务器升级 Python 后旧 venv 的 bin/python3 可能变成悬空链接，
          # 仅用 -x .venv/bin/python 判断会漏掉这种“存在但不可用”的 venv。
          if ! .venv/bin/python -m pip --version >/dev/null 2>&1; then
            echo "backend venv 不可用，删除后重建"
            rm -rf .venv
            python3 -m venv .venv
          fi
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

          cd "$DEPLOY_PATH/web/frontend"
          npm ci
          npm run build

          # Nginx serves this directory directly; building dist alone does not update the page.
          test -n "$DEPLOY_STATIC_PATH"
          test -d "$DEPLOY_STATIC_PATH"
          install -d -m 0755 "$DEPLOY_STATIC_PATH/assets"
          find "$DEPLOY_PATH/web/frontend/dist/assets" -maxdepth 1 -type f \
            -exec install -m 0644 {} "$DEPLOY_STATIC_PATH/assets/" \;
          install -m 0644 "$DEPLOY_PATH/web/frontend/dist/index.html" "$DEPLOY_STATIC_PATH/index.html"
          install -m 0644 "$DEPLOY_PATH/web/frontend/dist/tabletop.html" "$DEPLOY_STATIC_PATH/tabletop.html"

          # SEO 静态产物：robots / sitemap / 分类目录 / 全部条目页。
          install -m 0644 "$DEPLOY_PATH/web/frontend/dist/robots.txt" "$DEPLOY_STATIC_PATH/robots.txt"
          install -m 0644 "$DEPLOY_PATH/web/frontend/dist/sitemap.xml" "$DEPLOY_STATIC_PATH/sitemap.xml"
          install -m 0644 "$DEPLOY_PATH/web/frontend/dist/catalog.html" "$DEPLOY_STATIC_PATH/catalog.html"
          # entry/ 必须全量递归同步，并清掉上一次构建里已不存在的旧页面。
          if [ -e "$DEPLOY_STATIC_PATH/entry" ]; then
            rm -rf "$DEPLOY_STATIC_PATH/entry"
          fi
          cp -R "$DEPLOY_PATH/web/frontend/dist/entry" "$DEPLOY_STATIC_PATH/entry"

          test -s "$DEPLOY_STATIC_PATH/index.html"
          test -s "$DEPLOY_STATIC_PATH/tabletop.html"
          test -s "$DEPLOY_STATIC_PATH/robots.txt"
          test -s "$DEPLOY_STATIC_PATH/sitemap.xml"
          test -s "$DEPLOY_STATIC_PATH/catalog.html"
          test -d "$DEPLOY_STATIC_PATH/entry"
          test -n "$(find "$DEPLOY_STATIC_PATH/entry" -type f -name '*.html' -print -quit)"

          sudo systemctl restart "$DEPLOY_SERVICE"
          sudo systemctl is-active --quiet "$DEPLOY_SERVICE"

          for i in $(seq 1 30); do
            if curl -fsS "$HEALTH_URL" >/dev/null; then
              echo "health check ok"
              exit 0
            fi
            echo "waiting for health check... ${i}/30"
            sleep 2
          done

          echo "health check failed after waiting"
          sudo systemctl status "$DEPLOY_SERVICE" --no-pager -l || true
          exit 1
          REMOTE
